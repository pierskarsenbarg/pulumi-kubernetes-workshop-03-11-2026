[project]
name = "demo-6-pko-stack"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pulumi>=3.0.0,<4.0.0",
    "pulumi-flux-source",
    "pulumi-kubernetes>=4.34.3",
    "pulumi-pulumi-operator",
]

[tool.uv.sources]
pulumi-flux-source = { path = "sdks/flux-source" }
pulumi-pulumi-operator = { path = "sdks/pulumi-operator" }
