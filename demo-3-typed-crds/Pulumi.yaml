name: demo-3-typed-crds
description: A minimal Python Pulumi program
runtime:
  name: python
  options:
    toolchain: uv
config:
  pulumi:tags:
    value:
      pulumi:template: python
packages:
  gateway-networking:
    source: kubernetes
    version: 4.34.2
    extensions:
      - name=gateway-networking
      - crd-manifest=crd/gateway-api-v1.6.0-standard.yaml
